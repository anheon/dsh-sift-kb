name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
      - name: Tests
        run: node --test test/config.test.mjs test/mcp.test.mjs test/routes.test.mjs test/imports.test.mjs test/client-identity.test.mjs
